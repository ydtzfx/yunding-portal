name: Publish v1.1.0 Release

on:
  push:
    branches: [release/v1.1.0]
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.0
          TARGET: eac24de76cb3c342cfdcd29c3dbecddc5efa91ed
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
            exit 0
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET"             --title "v1.1.0 — Operational Complete"             --notes-file docs/releases/v1.1.0.md             --verify-tag=false

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
