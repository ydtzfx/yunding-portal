name: Publish v1.0.0 Release

on:
  push:
    branches: [release/v1.0.0]
    paths:
      - .github/workflows/publish-v1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
          TARGET: ea9e51643840041aa656f83f22ca37f96e99d6d5
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
            exit 0
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET"             --title "v1.0.0 — Institutional Grade Release"             --notes-file docs/releases/v1.0.0.md             --verify-tag=false

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
