name: Publish v1.1.3 Release

on:
  push:
    branches: [release/v1.1.3]
    paths:
      - .github/workflows/publish-v1.1.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create v1.1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.3
          TARGET: 9f12a34d97a4400e3e9c6c277a81cceda9e89788
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
            exit 0
          fi
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET"             --title "v1.1.3 — Confidence Gated"             --notes-file docs/releases/v1.1.3.md             --verify-tag=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
