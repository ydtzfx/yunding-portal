name: Source Health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/source-health.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-health-report
          path: .reports/source-health.json
          if-no-files-found: warn
          retention-days: 30
