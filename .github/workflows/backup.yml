name: Recovery Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 0'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build recovery snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p backup
          git bundle create backup/yunding-portal.bundle --all
          tar -czf backup/research-content.tar.gz src/content public docs SECURITY.md README.md CHANGELOG.md package.json package-lock.json astro.config.mjs .github
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > backup/releases.json
          git rev-parse HEAD > backup/head-sha.txt
          (cd backup && sha256sum yunding-portal.bundle research-content.tar.gz releases.json head-sha.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: yunding-recovery-snapshot-${{ github.run_id }}
          path: backup/
          retention-days: 30
