name: Publish v1.1.1 Release

on:
  push:
    branches: [release/v1.1.1]
    paths:
      - .github/workflows/publish-v1.1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create v1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.1
          TARGET: 93225afef79772ec9a96ca3474c8c5c83decbf6d
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
            exit 0
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET"             --title "v1.1.1 — Contract Aligned"             --notes-file docs/releases/v1.1.1.md             --verify-tag=false

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url
