name: Backend Operations Validation
on:
  push:
    branches: [feat/backend-completion-pass]
    paths:
      - .github/workflows/backend-ops-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run content:check
      - run: node scripts/source-health.mjs
      - run: node scripts/uptime-check.mjs
      - name: Validate recovery bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p backup
          git bundle create backup/yunding-portal.bundle --all
          tar -czf backup/research-content.tar.gz src/content public docs SECURITY.md README.md CHANGELOG.md package.json package-lock.json astro.config.mjs .github
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > backup/releases.json
          git rev-parse HEAD > backup/head-sha.txt
          (cd backup && sha256sum yunding-portal.bundle research-content.tar.gz releases.json head-sha.txt > SHA256SUMS)
          (cd backup && sha256sum -c SHA256SUMS)
          git bundle verify backup/yunding-portal.bundle
